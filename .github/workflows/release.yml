name: Publish release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Read version and release notes
        run: |
          gh api "repos/$GH_REPO/contents/VERSION?ref=$RELEASE_COMMIT" -H 'Accept: application/vnd.github.raw+json' > VERSION
          gh api "repos/$GH_REPO/contents/CHANGELOG.md?ref=$RELEASE_COMMIT" -H 'Accept: application/vnd.github.raw+json' > CHANGELOG.md
      - name: Publish the version once
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version'; exit 1; }
          if gh release view "$version" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $version already exists."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          version = Path('VERSION').read_text().strip()
          lines = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if re.match(r'^## ' + re.escape(version) + r'(?:\s|$)', line))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          Path('RELEASE_NOTES.md').write_text('\n'.join(lines[start:end]).strip() + '\n', encoding='utf-8')
          PY
          gh release create "$version" --repo "$GH_REPO" --target "$RELEASE_COMMIT" --title "$version" --notes-file RELEASE_NOTES.md
